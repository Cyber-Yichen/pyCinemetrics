name: Build Windows Executable

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==69.5.1 wheel
          pip install pyinstaller==6.3.0
          pip install -r requirements.txt
      
      - name: Build executable
        run: |
          pyinstaller --clean pyCinemetrics.spec
      
      - name: Create release archive
        if: github.event_name == 'release'
        run: |
          Compress-Archive -Path dist/pyCinemetrics/* -DestinationPath pyCinemetrics-windows-x64.zip
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: pyCinemetrics-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyCinemetrics-windows
          path: dist/pyCinemetrics/
